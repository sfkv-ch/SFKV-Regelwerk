site_name: SFKV Regelwerk

docs_dir: _docs

theme:
  name: material
  language: de

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight

  palette:
    scheme: default
    primary: blue
    accent: light blue

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Start: index.md

  - Leitbild:
      - Übersicht: leitbild.md

  - Statuten:
      - Übersicht: statuten.md

  - Sportreglement:
      - Übersicht: sportreglement.md

  - Richtlinien:
      - Bonuspunkte: richtlinien/bonuspunkte.md
      - Delegiertenversammlung: richtlinien/delegiertenversammlung.md
      - Einzelcup: richtlinien/einzelcup.md
      - Klubcup: richtlinien/klubcup.md
      - Meisterschafts-Abbruch: richtlinien/meisterschafts-abbruch.md
      - Schweizermeisterschaft: richtlinien/schweizermeisterschaft.md
      - Senioren-Meisterschaft: richtlinien/senioren-meisterschaft.md
