site_name: SFKV Regelwerk

docs_dir: _docs

theme:
  name: material
  language: de

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight

  palette:
    scheme: default
    primary: blue
    accent: light blue

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Start: index.md

  - Verbandsmodell: verbandsmodell.md

  - Leitbild: leitbild.md

  - Statuten: statuten.md

  - Sportreglement: sportreglement.md

  - Richtlinien:
      - Bonuspunkte: bonuspunkte.md
      - Delegiertenversammlung: delegiertenversammlung.md
      - Einzelcup: einzelcup.md
      - Klubcup: klubcup.md
      - Meisterschafts-Abbruch: meisterschafts-abbruch.md
      - Schweizermeisterschaft: schweizermeisterschaft.md
      - Senioren-Meisterschaft: senioren-meisterschaft.md
