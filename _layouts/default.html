<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
</head>

<body>

<div style="display:flex; gap:20px;">

  <!-- LINKS -->
  <aside style="width:300px;">
    <h3>Dokumente</h3>

    {% assign groups = "Leitbild,Statuten,Reglemente,Richtlinien" | split: "," %}

    {% for group in groups %}
      <strong>{{ group }}</strong>
      <ul>
        {% assign docs = site.docs | where: "group", group | sort: "title" %}
        {% for doc in docs %}
          <li>
            <a href="{{ doc.url | relative_url }}">
              {{ doc.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    {% endfor %}

  </aside>

  <!-- CONTENT -->
  <main style="flex:1;">
    {{ content }}
  </main>

</div>

</body>
</html>
